
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Smart Lock</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <div class="symbol">🔐</div>
    <h1>Smart Lock</h1>
    <p id="status">Checking status...</p>

    <div class="pin-dots" id="dots">
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="keypad">
      <button onclick="digit('1')">1</button>
      <button onclick="digit('2')">2</button>
      <button onclick="digit('3')">3</button>
      <button onclick="digit('4')">4</button>
      <button onclick="digit('5')">5</button>
      <button onclick="digit('6')">6</button>
      <button onclick="digit('7')">7</button>
      <button onclick="digit('8')">8</button>
      <button onclick="digit('9')">9</button>
      <button onclick="clearPin()">C</button>
      <button onclick="digit('0')">0</button>
      <button onclick="backspace()">⌫</button>
    </div>

    <div class="actions">
      <button class="lock" onclick="control('locked')">
        🔒 Lock
      </button>
      <button class="unlock" onclick="control('unlocked')">
        🔓 Unlock
      </button>
    </div>

    <p class="note">Raspberry Pi Smart Lock Prototype</p>
  </main>

  <script>
    let pin = "";
    let busy = false;

    function updateDots() {
      const dots = document.querySelectorAll("#dots span");
      dots.forEach((dot, index) => {
        dot.classList.toggle("filled", index < pin.length);
      });
    }

    function digit(number) {
      if (busy || pin.length >= 4) return;
      pin += number;
      updateDots();
    }

    function clearPin() {
      if (busy) return;
      pin = "";
      updateDots();
    }

    function backspace() {
      if (busy) return;
      pin = pin.slice(0, -1);
      updateDots();
    }

    async function control(action) {
      const status = document.getElementById("status");

      if (busy) return;

      if (pin.length !== 4) {
        status.textContent = "Enter your 4-digit PIN first";
        return;
      }

      busy = true;
      status.textContent = "Sending command...";

      try {
        const response = await fetch("/api/control", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Lock-Token": pin
          },
          body: JSON.stringify({ action })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            response.status === 401
              ? "Incorrect PIN"
              : result.error || "Request failed"
          );
        }

        status.textContent = "Commanded: " + result.state;
      } catch (error) {
        status.textContent = error.message;
      } finally {
        pin = "";
        updateDots();
        busy = false;
      }
    }

    async function checkStatus() {
      try {
        const response = await fetch("/api/status");
        const result = await response.json();

        document.getElementById("status").textContent =
          "Last command: " + result.state +
          (result.simulation ? " (simulation)" : "");
      } catch {
        document.getElementById("status").textContent =
          "Unable to connect";
      }
    }

    checkStatus();
  </script>
</body>
</html>
